<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Customer Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f0e6ff 50%, #fce7f3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 480px;
            height: 700px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            background: #ffffff;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid #f1f1f4;
        }

        .header-avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            flex-shrink: 0;
        }

        .header-info h2 {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #fafbfc;
        }

        .message-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-group.bot {
            align-items: flex-start;
        }

        .message-group.user {
            align-items: flex-end;
        }

        .message-label {
            font-size: 11px;
            font-weight: 500;
            color: #9ca3af;
            padding: 0 4px;
            margin-bottom: 2px;
        }

        .message {
            max-width: 78%;
            padding: 12px 18px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            background: #ffffff;
            color: #374151;
            border-radius: 4px 18px 18px 18px;
            border: 1px solid #e5e7eb;
        }

        .message.user {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border-radius: 18px 4px 18px 18px;
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 14px 20px;
            background: #ffffff;
            border-radius: 4px 18px 18px 18px;
            border: 1px solid #e5e7eb;
            width: fit-content;
            animation: fadeIn 0.3s ease;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #d1d5db;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); background: #d1d5db; }
            40% { transform: scale(1); background: #8b5cf6; }
        }

        /* Quick replies */
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 24px 16px 24px;
            background: #fafbfc;
        }

        .quick-reply-btn {
            padding: 8px 16px;
            background: #ffffff;
            color: #6366f1;
            border: 1.5px solid #c7d2fe;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .quick-reply-btn:hover {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
            transform: translateY(-1px);
        }

        /* Input area */
        .chat-input {
            padding: 16px 20px;
            border-top: 1px solid #f1f1f4;
            display: flex;
            gap: 10px;
            background: #ffffff;
            align-items: center;
        }

        .chat-input input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
            background: #fafbfc;
        }

        .chat-input input:focus {
            border-color: #6366f1;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .chat-input input::placeholder {
            color: #b0b7c3;
        }

        .send-btn {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        /* Timestamp */
        .timestamp {
            font-size: 10px;
            color: #b0b7c3;
            padding: 0 4px;
            margin-top: 2px;
        }

        /* Scrollbar */
        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #bbb;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-avatar">&#x1F916;</div>
            <div class="header-info">
                <h2>AI Customer Support</h2>
                <div class="header-status">
                    <span class="status-dot"></span>
                    Online — Typically replies instantly
                </div>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message-group bot">
                <span class="message-label">Support Bot</span>
                <div class="message bot">
                    Hi there! &#x1F44B; Welcome to our customer support. How can I help you today?
                </div>
                <span class="timestamp" id="welcomeTime"></span>
            </div>
        </div>

        <div class="quick-replies" id="quickReplies">
            <button class="quick-reply-btn" onclick="sendQuickReply('Where is my order?')">&#x1F4E6; Track Order</button>
            <button class="quick-reply-btn" onclick="sendQuickReply('What is your return policy?')">&#x1F504; Returns</button>
            <button class="quick-reply-btn" onclick="sendQuickReply('What payment methods do you accept?')">&#x1F4B3; Payment</button>
            <button class="quick-reply-btn" onclick="sendQuickReply('What are your business hours?')">&#x1F552; Hours</button>
            <button class="quick-reply-btn" onclick="sendQuickReply('I need to speak to a human')">&#x1F464; Human Agent</button>
        </div>

        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Type your message..."
                   onkeypress="if(event.key === 'Enter') sendMessage()">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const quickReplies = document.getElementById('quickReplies');

        // Set welcome message time
        document.getElementById('welcomeTime').textContent = getTime();

        // Notification sound using Web Audio API
        function playNotificationSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                // First tone
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.frequency.value = 580;
                osc1.type = 'sine';
                gain1.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc1.start(audioCtx.currentTime);
                osc1.stop(audioCtx.currentTime + 0.3);

                // Second tone (higher)
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.frequency.value = 780;
                osc2.type = 'sine';
                gain2.gain.setValueAtTime(0.15, audioCtx.currentTime + 0.15);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
                osc2.start(audioCtx.currentTime + 0.15);
                osc2.stop(audioCtx.currentTime + 0.45);
            } catch (e) {
                // Sound not supported, silently ignore
            }
        }

        function getTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function addMessage(text, sender) {
            const group = document.createElement('div');
            group.className = 'message-group ' + sender;

            const label = document.createElement('span');
            label.className = 'message-label';
            label.textContent = sender === 'bot' ? 'Support Bot' : 'You';

            const msg = document.createElement('div');
            msg.className = 'message ' + sender;
            msg.textContent = text;

            const time = document.createElement('span');
            time.className = 'timestamp';
            time.textContent = getTime();

            group.appendChild(label);
            group.appendChild(msg);
            group.appendChild(time);
            chatMessages.appendChild(group);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            const group = document.createElement('div');
            group.className = 'message-group bot';
            group.id = 'typingGroup';

            const label = document.createElement('span');
            label.className = 'message-label';
            label.textContent = 'Support Bot';

            const typing = document.createElement('div');
            typing.className = 'typing-indicator';
            typing.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

            group.appendChild(label);
            group.appendChild(typing);
            chatMessages.appendChild(group);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typingGroup');
            if (typing) typing.remove();
        }

        function hideQuickReplies() {
            quickReplies.style.display = 'none';
        }

        function sendQuickReply(text) {
            userInput.value = text;
            sendMessage();
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            hideQuickReplies();
            addMessage(message, 'user');
            userInput.value = '';
            sendBtn.disabled = true;
            showTyping();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                removeTyping();
                addMessage(data.response, 'bot');
                playNotificationSound();

            } catch (error) {
                removeTyping();
                addMessage('Sorry, something went wrong. Please try again.', 'bot');
                playNotificationSound();
            }

            sendBtn.disabled = false;
            userInput.focus();
        }

        // Focus input on load
        userInput.focus();
    </script>
</body>
</html>
